openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: branches
    description: Public branch directory
  - name: admin
    description: Protected Headquarters administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /branches:
    get:
      operationId: listBranches
      tags: [branches]
      summary: List active branches
      responses:
        "200":
          description: Active branch directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
  /branches/directory:
    get:
      operationId: getBranchDirectory
      tags: [branches]
      summary: List published Royalhouse assemblies and additional managed locations
      responses:
        "200":
          description: Official directory snapshot with source links and managed additions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchDirectory"
  /admin/me:
    get:
      operationId: getAdminProfile
      tags: [admin]
      summary: Get the signed-in administrator profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authorized administrator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"
        "401":
          description: Authentication required
        "403":
          description: Authenticated account has no active admin assignment
  /admin/role-config:
    get:
      operationId: getAdminRoleConfig
      tags: [admin]
      summary: List configured departments, roles, and supported permissions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Department and role configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleConfig"
        "403":
          description: Super Admin access required
  /admin/departments:
    post:
      operationId: createAdminDepartment
      tags: [admin]
      summary: Create a department for role configuration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDepartmentCreateRequest"
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDepartment"
        "400":
          description: Invalid department
        "403":
          description: Super Admin access required
  /admin/departments/{id}:
    patch:
      operationId: updateAdminDepartment
      tags: [admin]
      summary: Rename or deactivate a department
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDepartmentUpdateRequest"
      responses:
        "200":
          description: Department updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDepartment"
        "400":
          description: Invalid department
        "403":
          description: Super Admin access required
        "404":
          description: Department not found
        "409":
          description: Department still has active administrator assignments
  /admin/roles:
    post:
      operationId: createAdminRole
      tags: [admin]
      summary: Create a department role with configured module permissions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleCreateRequest"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRole"
        "400":
          description: Invalid role
        "403":
          description: Super Admin access required
  /admin/roles/{id}:
    patch:
      operationId: updateAdminRole
      tags: [admin]
      summary: Edit or deactivate a department role
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleUpdateRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRole"
        "400":
          description: Invalid role
        "403":
          description: Super Admin access required
        "404":
          description: Role not found
        "409":
          description: Role has active administrator assignments or is protected
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List administrator assignments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Administrator assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          description: Authentication required
        "403":
          description: Super Admin access required
    post:
      operationId: grantAdminAccess
      tags: [admin]
      summary: Grant or update access for a verified Clerk account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserGrant"
      responses:
        "201":
          description: Administrator access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "403":
          description: Super Admin access required
        "404":
          description: No verified Clerk account found for this email
  /admin/users/{clerkUserId}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Change an administrator's role or revoke access
      security:
        - bearerAuth: []
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Administrator assignment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "403":
          description: Super Admin access required
        "404":
          description: Administrator assignment not found
        "409":
          description: Cannot remove or demote the last active Super Admin
  /admin/branches:
    post:
      operationId: createBranch
      tags: [admin]
      summary: Create a branch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          description: Invalid branch
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
  /admin/branches/{id}:
    patch:
      operationId: updateBranch
      tags: [admin]
      summary: Update a branch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchUpdate"
      responses:
        "200":
          description: Branch updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          description: Invalid branch
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Branch not found
  /admin/branches/{id}/archive:
    post:
      operationId: archiveBranch
      tags: [admin]
      summary: Archive a branch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archived branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Branch not found
  /admin/members:
    get:
      operationId: listAdminMembers
      tags: [admin]
      summary: Search real member profiles in the role's authorized scope
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Matching member profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectPerson"
        "403":
          description: Members access required
    post:
      operationId: createAdminMember
      tags: [admin]
      summary: Add a member profile to the shared people records
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMemberInput"
      responses:
        "201":
          description: Member profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectPerson"
        "400":
          description: Invalid member
        "403":
          description: Member creation permission required
  /admin/members/{id}:
    patch:
      operationId: updateAdminMember
      tags: [admin]
      summary: Update a member profile in the shared people records
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMemberUpdateRequest"
      responses:
        "200":
          description: Member profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectPerson"
        "400":
          description: Invalid member
        "403":
          description: Member update permission required
        "404":
          description: Member not found
  /admin/department-tasks:
    get:
      operationId: listDepartmentTasks
      tags: [admin]
      summary: List real tasks for the effective role's department scope
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Department task records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentTask"
        "403":
          description: Department task access required
    post:
      operationId: createDepartmentTask
      tags: [admin]
      summary: Create a shared department task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentTaskInput"
      responses:
        "201":
          description: Department task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentTask"
        "400":
          description: Invalid task
        "403":
          description: Task management permission required
  /admin/department-tasks/{id}/complete:
    post:
      operationId: completeDepartmentTask
      tags: [admin]
      summary: Mark a department task complete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Completed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentTask"
        "403":
          description: Task management permission required
        "404":
          description: Task not found
  /admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      tags: [admin]
      summary: Read recent administrative activity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent audit records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAuditLog"
        "403":
          description: Audit log permission required
  /admin/connect/notifications:
    get:
      operationId: listConnectNotifications
      tags: [connect]
      summary: List recent notifications for the signed-in Connect Team account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current account's Connect Team notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectNotification"
        "403":
          description: Connect Team module access required
  /admin/connect/notifications/{id}/read:
    post:
      operationId: markConnectNotificationRead
      tags: [connect]
      summary: Mark one of the signed-in account's notifications as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectNotification"
        "403":
          description: The notification belongs to another account
        "404":
          description: Notification not found
  /admin/connect/options:
    get:
      operationId: listConnectWorkflowOptions
      tags: [admin]
      summary: List active Connect Team workflow options
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configurable call and situation options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowOption"
  /admin/connect/people:
    get:
      operationId: listConnectPeople
      tags: [admin]
      summary: Search people in the Connect Team scope
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: People visible to the signed-in Connect Team user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectPerson"
    post:
      operationId: createConnectPerson
      tags: [admin]
      summary: Create a visitor or member person record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectPersonInput"
      responses:
        "201":
          description: Person created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectPerson"
        "400":
          description: Invalid person data
  /admin/connect/summary:
    get:
      operationId: getConnectSummary
      tags: [admin]
      summary: Get Connect Team workload summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connect Team metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectSummary"
  /admin/connect/people/{id}:
    get:
      operationId: getConnectPersonProfile
      tags: [admin]
      summary: Get a person profile and interaction history
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Person profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectPersonProfile"
        "403":
          description: Person is outside the user's assignment scope
        "404":
          description: Person not found
  /admin/connect/people/{id}/assign:
    post:
      operationId: assignConnectPerson
      tags: [admin]
      summary: Assign a person to a Connect Team member
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignConnectPersonRequest"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectAssignment"
        "400":
          description: Invalid assignment
        "403":
          description: Assignment permission denied
        "404":
          description: Person not found
  /admin/connect/people/{id}/interactions:
    post:
      operationId: logConnectInteraction
      tags: [admin]
      summary: Log a structured Connect Team interaction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogConnectInteractionRequest"
      responses:
        "201":
          description: Interaction and triggered follow-ups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogConnectInteractionResult"
        "400":
          description: Invalid interaction
        "403":
          description: Person is outside the user's assignment scope
        "404":
          description: Person not found
  /admin/connect/follow-ups/{id}/complete:
    post:
      operationId: completeConnectFollowUp
      tags: [admin]
      summary: Mark a Connect Team follow-up complete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Completed follow-up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectFollowUp"
        "403":
          description: Follow-up is outside the user's assignment scope
        "404":
          description: Follow-up not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BranchDirectoryEntry:
      type: object
      required: [id, name, locationGroup, country, region, area, temple, pastor, address, latitude, longitude, sourceUrl, official, featured]
      properties:
        id: { type: string }
        name: { type: string }
        locationGroup: { type: string }
        country: { type: ["string", "null"] }
        region: { type: string }
        area: { type: string }
        temple: { type: ["string", "null"] }
        pastor: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        sourceUrl: { type: ["string", "null"] }
        official: { type: boolean }
        featured: { type: boolean }
    BranchDirectory:
      type: object
      required: [entries, officialEntryCount, checkedAt, sources]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/BranchDirectoryEntry" }
        officialEntryCount: { type: number, minimum: 0, multipleOf: 1 }
        checkedAt: { type: string }
        sources:
          type: array
          items: { type: string }
    Branch:
      type: object
      required: [id, name, country, region, city, address, pastor, latitude, longitude, featured, archived]
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        region: { type: string }
        city: { type: string }
        address: { type: string }
        pastor: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        featured: { type: boolean }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BranchInput:
      type: object
      required: [name, country, region, city, address, pastor, latitude, longitude]
      properties:
        name: { type: string, minLength: 1 }
        country: { type: string, minLength: 1 }
        region: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        pastor: { type: string, minLength: 1 }
        latitude: { type: number }
        longitude: { type: number }
        featured: { type: boolean }
    BranchUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        country: { type: string, minLength: 1 }
        region: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        pastor: { type: string, minLength: 1 }
        latitude: { type: number }
        longitude: { type: number }
        featured: { type: boolean }
        archived: { type: boolean }
    AdminProfile:
      type: object
      required: [clerkUserId, role, effectiveRole, modules, capabilities]
      properties:
        clerkUserId: { type: string }
        role: { type: string }
        effectiveRole: { type: string }
        branchId: { type: ["string", "null"] }
        modules:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
    AdminDepartment:
      type: object
      required: [id, name, active, roles]
      properties:
        id: { type: string }
        name: { type: string }
        active: { type: boolean }
        roles:
          type: array
          items: { $ref: "#/components/schemas/AdminRole" }
    AdminRole:
      type: object
      required: [id, departmentId, name, modules, capabilities, grantable, active, system]
      properties:
        id: { type: string }
        departmentId: { type: string }
        name: { type: string }
        modules:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
        grantable: { type: boolean }
        active: { type: boolean }
        system: { type: boolean }
    AdminRoleConfig:
      type: object
      required: [departments, availableModules, availableCapabilities]
      properties:
        departments:
          type: array
          items: { $ref: "#/components/schemas/AdminDepartment" }
        availableModules:
          type: array
          items: { type: string }
        availableCapabilities:
          type: array
          items: { type: string }
    AdminDepartmentCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    AdminDepartmentUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        active: { type: boolean }
    AdminRoleCreateRequest:
      type: object
      required: [departmentId, name, modules, capabilities]
      properties:
        departmentId: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        modules:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
        grantable: { type: boolean }
    AdminRoleUpdateRequest:
      type: object
      minProperties: 1
      properties:
        departmentId: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        modules:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
        grantable: { type: boolean }
        active: { type: boolean }
    AdminUserRole:
      type: string
    AdminUser:
      type: object
      required: [clerkUserId, role, active]
      properties:
        clerkUserId: { type: string }
        email: { type: ["string", "null"] }
        fullName: { type: ["string", "null"] }
        role: { $ref: "#/components/schemas/AdminUserRole" }
        active: { type: boolean }
    AdminUserList:
      type: array
      items:
        $ref: "#/components/schemas/AdminUser"
    AdminUserGrant:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          minLength: 3
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
        role: { $ref: "#/components/schemas/AdminUserRole" }
    AdminUserUpdate:
      type: object
      minProperties: 1
      properties:
        role: { $ref: "#/components/schemas/AdminUserRole" }
        active: { type: boolean }
    AdminMemberInput:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 140 }
        phone: { type: string, maxLength: 60 }
        email: { type: string, maxLength: 180 }
        branchId: { type: ["string", "null"] }
        notes: { type: string, maxLength: 2000 }
    AdminMemberUpdateRequest:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 140 }
        phone: { type: ["string", "null"], maxLength: 60 }
        email: { type: ["string", "null"], maxLength: 180 }
        branchId: { type: ["string", "null"] }
        notes: { type: ["string", "null"], maxLength: 2000 }
    DepartmentTask:
      type: object
      required: [id, departmentId, title, status, createdByClerkUserId, createdAt, updatedAt]
      properties:
        id: { type: string }
        departmentId: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        status: { type: string }
        dueAt: { type: ["string", "null"], format: date-time }
