openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: branches
    description: Public branch directory
  - name: admin
    description: Protected Headquarters administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /branches:
    get:
      operationId: listBranches
      tags: [branches]
      summary: List active branches
      responses:
        "200":
          description: Active branch directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
  /admin/me:
    get:
      operationId: getAdminProfile
      tags: [admin]
      summary: Get the signed-in administrator profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authorized administrator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"
        "401":
          description: Authentication required
        "403":
          description: Authenticated account has no active admin assignment
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List administrator assignments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Administrator assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          description: Authentication required
        "403":
          description: Super Admin access required
    post:
      operationId: grantAdminAccess
      tags: [admin]
      summary: Grant or update access for a verified Clerk account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserGrant"
      responses:
        "201":
          description: Administrator access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "403":
          description: Super Admin access required
        "404":
          description: No verified Clerk account found for this email
  /admin/users/{clerkUserId}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Change an administrator's role or revoke access
      security:
        - bearerAuth: []
      parameters:
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Administrator assignment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "403":
          description: Super Admin access required
        "404":
          description: Administrator assignment not found
        "409":
          description: Cannot remove or demote the last active Super Admin
  /admin/branches:
    post:
      operationId: createBranch
      tags: [admin]
      summary: Create a branch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          description: Invalid branch
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
  /admin/branches/{id}:
    patch:
      operationId: updateBranch
      tags: [admin]
      summary: Update a branch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchUpdate"
      responses:
        "200":
          description: Branch updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          description: Invalid branch
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Branch not found
  /admin/branches/{id}/archive:
    post:
      operationId: archiveBranch
      tags: [admin]
      summary: Archive a branch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archived branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Branch not found
  /admin/connect/options:
    get:
      operationId: listConnectWorkflowOptions
      tags: [admin]
      summary: List active Connect Team workflow options
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configurable call and situation options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowOption"
  /admin/connect/people:
    get:
      operationId: listConnectPeople
      tags: [admin]
      summary: Search people in the Connect Team scope
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: People visible to the signed-in Connect Team user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectPerson"
    post:
      operationId: createConnectPerson
      tags: [admin]
      summary: Create a visitor or member person record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectPersonInput"
      responses:
        "201":
          description: Person created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectPerson"
        "400":
          description: Invalid person data
  /admin/connect/summary:
    get:
      operationId: getConnectSummary
      tags: [admin]
      summary: Get Connect Team workload summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connect Team metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectSummary"
  /admin/connect/people/{id}:
    get:
      operationId: getConnectPersonProfile
      tags: [admin]
      summary: Get a person profile and interaction history
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Person profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectPersonProfile"
        "403":
          description: Person is outside the user's assignment scope
        "404":
          description: Person not found
  /admin/connect/people/{id}/assign:
    post:
      operationId: assignConnectPerson
      tags: [admin]
      summary: Assign a person to a Connect Team member
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignConnectPersonRequest"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectAssignment"
        "400":
          description: Invalid assignment
        "403":
          description: Assignment permission denied
        "404":
          description: Person not found
  /admin/connect/people/{id}/interactions:
    post:
      operationId: logConnectInteraction
      tags: [admin]
      summary: Log a structured Connect Team interaction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogConnectInteractionRequest"
      responses:
        "201":
          description: Interaction and triggered follow-ups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogConnectInteractionResult"
        "400":
          description: Invalid interaction
        "403":
          description: Person is outside the user's assignment scope
        "404":
          description: Person not found
  /admin/connect/follow-ups/{id}/complete:
    post:
      operationId: completeConnectFollowUp
      tags: [admin]
      summary: Mark a Connect Team follow-up complete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Completed follow-up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectFollowUp"
        "403":
          description: Follow-up is outside the user's assignment scope
        "404":
          description: Follow-up not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Branch:
      type: object
      required: [id, name, country, region, city, address, pastor, latitude, longitude, featured, archived]
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        region: { type: string }
        city: { type: string }
        address: { type: string }
        pastor: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        featured: { type: boolean }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BranchInput:
      type: object
      required: [name, country, region, city, address, pastor, latitude, longitude]
      properties:
        name: { type: string, minLength: 1 }
        country: { type: string, minLength: 1 }
        region: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        pastor: { type: string, minLength: 1 }
        latitude: { type: number }
        longitude: { type: number }
        featured: { type: boolean }
    BranchUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        country: { type: string, minLength: 1 }
        region: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        pastor: { type: string, minLength: 1 }
        latitude: { type: number }
        longitude: { type: number }
        featured: { type: boolean }
        archived: { type: boolean }
    AdminProfile:
      type: object
      required: [clerkUserId, role, modules]
      properties:
        clerkUserId: { type: string }
        role: { type: string }
        branchId: { type: ["string", "null"] }
        modules:
          type: array
          items: { type: string }
    AdminUserRole:
      type: string
      enum:
        - Super Admin
        - Headquarters Admin
        - Regional Admin
        - Branch Admin
        - Pastor
        - Pastoral Leadership
        - Church Administrator
        - Connect Team Leader
        - Connect Team Member
        - Ministry Leader
        - Finance Team
        - Media Team
        - Store Manager
        - Finance Administrator
        - Finance Team Member
        - Foundation School Administrator
        - Foundation School Team Member
        - Ministries Administrator
        - Media Administrator
        - Media Team Member
        - Events Administrator
        - Events Team Member
        - Communications Administrator
        - Membership Administrator
        - Branch Administrator
    AdminUser:
      type: object
      required: [clerkUserId, role, active]
      properties:
        clerkUserId: { type: string }
        email: { type: ["string", "null"] }
        fullName: { type: ["string", "null"] }
        role: { $ref: "#/components/schemas/AdminUserRole" }
        active: { type: boolean }
    AdminUserList:
      type: array
      items:
        $ref: "#/components/schemas/AdminUser"
    AdminUserGrant:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          minLength: 3
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
        role: { $ref: "#/components/schemas/AdminUserRole" }
    AdminUserUpdate:
      type: object
      minProperties: 1
      properties:
        role: { $ref: "#/components/schemas/AdminUserRole" }
        active: { type: boolean }
    ConnectPerson:
      type: object
      required: [id, personType, fullName, visitorStatus, membershipStatus, foundationSchoolStatus, pastoralFollowUp, tags, createdAt, updatedAt]
      properties:
        id: { type: string }
        branchId: { type: ["string", "null"] }
        personType: { type: string }
        fullName: { type: string }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        visitorId: { type: ["string", "null"] }
        memberId: { type: ["string", "null"] }
        visitorStatus: { type: string }
        membershipStatus: { type: string }
        firstVisitAt: { type: ["string", "null"], format: date-time }
        lastVisitAt: { type: ["string", "null"], format: date-time }
        foundationSchoolStatus: { type: string }
        notes: { type: ["string", "null"] }
        prayerNeeds: { type: ["string", "null"] }
        pastoralFollowUp: { type: boolean }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConnectPersonInput:
      type: object
      required: [fullName]
      properties:
        branchId: { type: ["string", "null"] }
        personType: { type: string }
        fullName: { type: string, minLength: 1 }
        phone: { type: string }
        email: { type: string }
        visitorId: { type: string }
        memberId: { type: string }
        visitorStatus: { type: string }
        membershipStatus: { type: string }
        firstVisitAt: { type: string, format: date-time }
        lastVisitAt: { type: string, format: date-time }
        foundationSchoolStatus: { type: string }
        notes: { type: string }
        prayerNeeds: { type: string }
        pastoralFollowUp: { type: boolean }
        tags:
          type: array
          items: { type: string }
    ConnectAssignment:
      type: object
      required: [id, personId, assignedClerkUserId, assignedByClerkUserId, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        personId: { type: string }
        assignedClerkUserId: { type: string }
        assignedByClerkUserId: { type: string }
        status: { type: string }
        dueAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConnectInteraction:
      type: object
      required: [id, personId, actorClerkUserId, interactionType, outcomeCode, situationCodes, prayerNeeded, pastoralAttention, visitationRequested, foundationSchoolInterest, createdAt]
      properties:
        id: { type: string }
        personId: { type: string }
        actorClerkUserId: { type: string }
        interactionType: { type: string }
        outcomeCode: { type: string }
        situationCodes:
          type: array
          items: { type: string }
        prayerNeeded: { type: boolean }
        pastoralAttention: { type: boolean }
        visitationRequested: { type: boolean }
        foundationSchoolInterest: { type: boolean }
        notes: { type: ["string", "null"] }
        nextFollowUpAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    ConnectFollowUp:
      type: object
      required: [id, personId, followUpType, status, dueAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        personId: { type: string }
        interactionId: { type: ["string", "null"] }
        assignedClerkUserId: { type: ["string", "null"] }
        followUpType: { type: string }
        status: { type: string }
        dueAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowOption:
      type: object
      required: [id, code, label, category, active, triggerConfig, createdAt, updatedAt]
      properties:
        id: { type: string }
        code: { type: string }
        label: { type: string }
        category: { type: string }
        active: { type: boolean }
        triggerConfig:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConnectSummary:
      type: object
      required: [peopleCount, assignedCount, unassignedCount, callsToday, pendingFollowUps, overdueFollowUps, pastoralAttentionCount]
      properties:
        peopleCount: { type: number }
        assignedCount: { type: number }
        unassignedCount: { type: number }
        callsToday: { type: number }
        pendingFollowUps: { type: number }
        overdueFollowUps: { type: number }
        pastoralAttentionCount: { type: number }
    AssignConnectPersonRequest:
      type: object
      required: [assignedClerkUserId]
      properties:
        assignedClerkUserId: { type: string, minLength: 1 }
        dueAt: { type: string, format: date-time }
    LogConnectInteractionRequest:
      type: object
      required: [outcomeCode]
      properties:
        interactionType: { type: string }
        outcomeCode: { type: string, minLength: 1 }
        situationCodes:
          type: array
          items: { type: string }
        prayerNeeded: { type: boolean }
        pastoralAttention: { type: boolean }
        visitationRequested: { type: boolean }
        foundationSchoolInterest: { type: boolean }
        notes: { type: string }
        nextFollowUpAt: { type: string, format: date-time }
    ConnectPersonProfile:
      type: object
      required: [person, assignments, interactions, followUps]
      properties:
        person:
          $ref: "#/components/schemas/ConnectPerson"
        assignments:
          type: array
          items: { $ref: "#/components/schemas/ConnectAssignment" }
        interactions:
          type: array
          items: { $ref: "#/components/schemas/ConnectInteraction" }
        followUps:
          type: array
          items: { $ref: "#/components/schemas/ConnectFollowUp" }
    LogConnectInteractionResult:
      type: object
      required: [interaction, followUps]
      properties:
        interaction:
          $ref: "#/components/schemas/ConnectInteraction"
        followUps:
          type: array
          items: { $ref: "#/components/schemas/ConnectFollowUp" }

