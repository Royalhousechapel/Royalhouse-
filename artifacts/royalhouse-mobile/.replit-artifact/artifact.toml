kind = "mobile"
previewPath = "/"
title = "Royalhouse Chapel Mobile"
description = "A premium mobile-first member experience for Royalhouse Chapel Worldwide, bringing ministry content, sermons, events, prayer, giving, ministries, and member access into one connected app."
version = "1.0.0"
id = "artifacts/royalhouse-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23100

[services.development]
run = "pnpm --filter @workspace/royalhouse-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/royalhouse-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/royalhouse-mobile", "run", "serve" ]

[services.env]
PORT = "23100"
BASE_PATH = "/"
